<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF8C39" />
    </linearGradient>
  </defs>
  <!-- Arrière-plan avec dégradé de marque orange -->
  <rect width="32" height="32" rx="8" fill="url(#logoGrad)" />
  <!-- Dessin vectoriel du cerveau / circuit neuronal en blanc -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hémisphère gauche -->
    <path d="M16 7.5a4.5 4.5 0 0 0-4.5 4.5 3.5 3.5 0 0 0 1 2.5 3.5 3.5 0 0 0-1 4.5 4.5 4.5 0 0 0 4.5 4.5" />
    <!-- Hémisphère droit -->
    <path d="M16 7.5a4.5 4.5 0 0 1 4.5 4.5 3.5 3.5 0 0 1-1 2.5 3.5 3.5 0 0 1 1 4.5 4.5 4.5 0 0 1-4.5 4.5" />
    <!-- Ligne médiane -->
    <path d="M16 7.5v16.5" />
    <!-- Connexions et nœuds -->
    <circle cx="11.5" cy="12" r="0.8" fill="#FFFFFF" />
    <circle cx="20.5" cy="12" r="0.8" fill="#FFFFFF" />
    <circle cx="11.5" cy="19.5" r="0.8" fill="#FFFFFF" />
    <circle cx="20.5" cy="19.5" r="0.8" fill="#FFFFFF" />
  </g>
</svg>